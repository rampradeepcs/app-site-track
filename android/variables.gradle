ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    // The phone's own face or fingerprint, asked for at the gate.
    androidxBiometricVersion = '1.1.0'

    /* ---------------------------------------------------------- wear os */
    /* The watch module only. The phone app is untouched by these. */
    kotlinVersion = '2.0.21'
    // Wear's own Compose layer: material (stable) rather than material3,
    // which is still alpha and would put a preview dependency on a shift.
    wearComposeVersion = '1.4.1'
    composeBomVersion = '2024.10.00'
    activityComposeVersion = '1.9.3'
    // The Data Layer: how the phone and the watch talk at all.
    playServicesWearableVersion = '18.2.0'
    wearVersion = '1.3.0'
}