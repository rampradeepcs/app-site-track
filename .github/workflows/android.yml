name: Android APK

on:
  push:
    branches: [main]
    paths: ["src/**", "android/**", "capacitor.config.ts", "package.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # `secrets` is not available to step-level `if`, so surface presence here.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI requires Node >= 22.
          node-version: 22
          cache: npm
      - run: npm ci

      # Capacitor serves the app off the device filesystem, so the web layer
      # ships as a static export rather than a server build.
      - name: Build static web bundle
        run: STATIC_EXPORT=true npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # Artifact upload is best-effort: it fails outright when the account's
      # Actions storage quota is full, and that must not fail a green build.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: workfence-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Primary delivery: a rolling prerelease. Release assets are not subject
      # to the Actions artifact quota, so the APK stays downloadable even when
      # artifact storage is exhausted.
      - name: Publish APK to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$apk" "workfence-debug-${GITHUB_SHA::7}.apk"
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest \
            --title "Workfence Android (latest debug build)" \
            --notes "Debug APK from \`${GITHUB_SHA::7}\`. Unsigned — enable *Install unknown apps* to sideload." \
            --prerelease \
            "workfence-debug-${GITHUB_SHA::7}.apk"

      # A release build needs a keystore. Add these repository secrets and the
      # step below produces a signed, installable release APK:
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Assemble signed release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm -f release.keystore

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        continue-on-error: true
        with:
          name: workfence-release-apk
          path: android/app/build/outputs/apk/release/*.apk
