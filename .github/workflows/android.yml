name: Android APK

on:
  push:
    branches: [main]
    paths: ["src/**", "android/**", "capacitor.config.ts", "package.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # `secrets` is not available to step-level `if`, so surface presence here.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI requires Node >= 22.
          node-version: 22
          cache: npm
      - run: npm ci

      # Capacitor serves the app off the device filesystem, so the web layer
      # ships as a static export rather than a server build.
      - name: Build static web bundle
        run: STATIC_EXPORT=true npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # v4: v3 still installs the legacy `tools` package, which Google stopped
      # serving in September 2026 ("Failed to find package 'tools'"), and that
      # took every build down at this step.
      - uses: android-actions/setup-android@v4

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee gradle.log

      # The run log is only readable signed in; an annotation is readable by
      # anyone who can see the run. So a failed build says why up there too.
      - name: Say why the build failed
        if: failure()
        run: |
          [ -f android/gradle.log ] || exit 0
          why=$(grep -E -A4 "What went wrong|^e: |error:" android/gradle.log | head -60)
          why=${why//'%'/'%25'}; why=${why//$'\r'/'%0D'}; why=${why//$'\n'/'%0A'}
          echo "::error title=Gradle build failed::${why:-see the Assemble debug APK step}"

      # Artifact upload is best-effort: it fails outright when the account's
      # Actions storage quota is full, and that must not fail a green build.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: workfence-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Primary delivery: a rolling prerelease. Release assets are not subject
      # to the Actions artifact quota, so the APK stays downloadable even when
      # artifact storage is exhausted.
      - name: Publish APK to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$apk" "workfence-debug-${GITHUB_SHA::7}.apk"
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest \
            --title "Workfence Android (latest debug build)" \
            --notes "Debug APK from \`${GITHUB_SHA::7}\`. Unsigned — enable *Install unknown apps* to sideload." \
            --prerelease \
            "workfence-debug-${GITHUB_SHA::7}.apk"

      # ------------------------------------------------------------ for Play
      # The signed app bundle Play takes, and a signed APK from the same build.
      # The debug APK above is no use there: Play refuses anything debuggable,
      # and wants a bundle signed with the upload key it has on file. Six
      # repository secrets turn this half on:
      #   ANDROID_KEYSTORE_BASE64     the upload keystore, `base64 -i upload.jks`
      #   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      #   SUPABASE_URL, SUPABASE_ANON_KEY   the same pair pages.yml reads
      # Without the keystore every step below is skipped and the run stays
      # green, with the debug APK still delivered.
      #
      # Phone only. The watch module is left out of the Play build for now.

      # The web layer is built again, against the live backend. The copy the
      # debug APK carries was built with no credentials, which is demo mode:
      # fine to sideload and look around, wrong to hand to testers who will
      # try to check in at a real site. An upload key with no backend
      # credentials fails the run rather than shipping demo mode by accident.
      - name: Rebuild the web bundle against the live backend
        if: env.HAS_KEYSTORE == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error title=No backend credentials::The upload key is set but SUPABASE_URL or SUPABASE_ANON_KEY is not, so the Play bundle would run in demo mode. Add both repository secrets."
            exit 1
          fi
          rm -rf .next out
          STATIC_EXPORT=true npm run build
          # A misnamed secret is silent otherwise: the build succeeds and demo
          # mode ships. Prove the URL reached the bundle.
          if ! grep -rqF "$NEXT_PUBLIC_SUPABASE_URL" out/_next/static; then
            echo "::error::The rebuilt web bundle contains no Supabase URL; it would run in demo mode."
            exit 1
          fi
          npx cap copy android

      - name: Assemble the signed app bundle and release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # The key never outlives the step, whether gradle succeeds or not.
          trap 'rm -f release.keystore' EXIT
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # Published as a rolling prerelease beside android-latest, for the same
      # reason: release assets are not subject to the Actions artifact quota.
      # Play turns a bundle away for two reasons worth catching here rather
      # than in the console: no signature, and a version code it has already
      # seen. The first is checked; the second is stated on the release.
      - name: Publish the Play bundle
        if: env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          map=android/app/build/outputs/mapping/release/mapping.txt
          verified=$(jarsigner -verify "$aab" 2>&1 || true)
          if ! grep -q "jar verified" <<<"$verified"; then
            echo "::error::$aab is not signed: $verified"
            exit 1
          fi
          code=$(grep -m1 -oE 'versionCode [0-9]+' android/app/build.gradle | awk '{print $2}')
          name=$(grep -m1 -oE 'versionName "[^"]+"' android/app/build.gradle | cut -d'"' -f2)
          stem="workfence-${name}-${code}"
          cp "$aab" "$stem.aab"
          cp "$apk" "$stem-release.apk"
          files=("$stem.aab" "$stem-release.apk")
          if [ -f "$map" ]; then cp "$map" "$stem-mapping.txt"; files+=("$stem-mapping.txt"); fi
          {
            echo "Signed with the upload key, built from \`${GITHUB_SHA::7}\` against the live backend. Phone only."
            echo
            echo "- \`$stem.aab\`: upload this in Play Console, under Test and release, to the track's new release."
            echo "- \`$stem-mapping.txt\`: the R8 mapping. In Play, open the bundle in App bundle explorer, then Downloads, then upload it as the ReTrace mapping file, so crash reports read as source."
            echo "- \`$stem-release.apk\`: the same build as an installable APK."
            echo
            echo "Version code **${code}**. Play refuses a version code it has seen before, so bump \`versionCode\` in \`android/app/build.gradle\` before the next upload."
          } > notes.md
          gh release delete android-play --yes --cleanup-tag 2>/dev/null || true
          gh release create android-play \
            --target "$GITHUB_SHA" \
            --title "Workfence Android ${name} (${code}) for Google Play" \
            --notes-file notes.md \
            --prerelease \
            "${files[@]}"
          echo "Play bundle: $stem.aab, version code $code" >> "$GITHUB_STEP_SUMMARY"
